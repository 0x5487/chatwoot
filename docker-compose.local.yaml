services:
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "${POSTGRES_HOST_PORT:-54323}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-chatwoot_dev}
      POSTGRES_USER: ${POSTGRES_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chatwoot}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME:-postgres} -d ${POSTGRES_DATABASE:-chatwoot_dev}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-chatwoot}"]
    ports:
      - "${REDIS_HOST_PORT:-63800}:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-chatwoot}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

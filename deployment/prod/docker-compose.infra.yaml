version: '3.8'

# Infrastructure Services Layer (Simulating AWS RDS, AWS ElastiCache, AWS S3)
# Use this docker-compose file when testing locally to simulate AWS infrastructure.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres_infra
    restart: always
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ../../docker/postgres/init-maxkb.sql:/docker-entrypoint-initdb.d/init-maxkb.sql
    environment:
      - POSTGRES_DB=chatwoot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres_password_123}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chatwoot"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: redis_infra
    restart: always
    command: ["sh", "-c", "redis-server --requirepass \"$REDIS_PASSWORD\""]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_password_123}
    volumes:
      - ./data/redis:/data
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_password_123}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs_infra
    restart: always
    command: "server -s3 -dir=/data"
    ports:
      - '127.0.0.1:8333:8333'
      - '127.0.0.1:9333:9333'
    volumes:
      - ./data/seaweedfs:/data

